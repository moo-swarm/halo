<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Halo — AI assistant (static)">
  <title>Halo — AI assistant (static)</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#0b1120"/>
    </radialGradient>
    <radialGradient id="coma">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.1" stop-color="#fffaf0"/>
      <stop offset="0.3" stop-color="#ffe9b8" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#f8c977" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dust" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff4dc" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fcd9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5b764" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ion" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f9ff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#7dd3fc" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="dustBlur" filterUnits="userSpaceOnUse" x="-220" y="-90" width="440" height="180">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="ionBlur" filterUnits="userSpaceOnUse" x="-220" y="-40" width="440" height="80">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <radialGradient id="light">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.2" stop-color="#fde9c0"/>
      <stop offset="0.4" stop-color="#bfdbfe" stop-opacity="0.9"/>
      <stop offset="0.65" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <mask id="ringMask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <g transform="rotate(-31.5 256.0 256.0)"><path d="M376.85 372.7A168 168 0 1 1 376.85 139.3" fill="none" stroke="#fff" stroke-width="48" stroke-linecap="round"/></g>
    </mask>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="dustShape" d="M0 -0.35C0.35 -0.6 0.75 -1 1 -0.9L1 0.9C0.75 1 0.35 0.6 0 0.35Z" fill="url(#dust)"/>
    <path id="ionShape" d="M0 -1C0.4 -0.6 0.8 -0.2 1 0C0.8 0.2 0.4 0.6 0 1Z" fill="url(#ion)"/>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256.0 256.0) rotate(-45)" opacity="0"><g transform="translate(84 0)"><g opacity="1"><g filter="url(#dustBlur)"><g transform="scale(60.26 24.84)"><use href="#dustShape"/></g></g><g filter="url(#ionBlur)"><g transform="scale(65.8 4.83)"><use href="#ionShape"/></g></g><g transform="scale(1.38)"><circle r="44" fill="url(#coma)"/><circle r="5.5" fill="#ffffff"/></g></g></g></g>
  <g filter="url(#ringGlow)">
    <g mask="url(#ringMask)">
      <rect width="512" height="512" fill="#1a3278"/>
      <g transform="translate(256.0 256.0) rotate(-45)"><g transform="translate(84 0)"><circle r="300" fill="url(#light)" opacity="0.74"/></g></g>
    </g>
  </g>
  <g transform="translate(256.0 256.0) rotate(-45)" opacity="1"><g transform="translate(84 0)"><g opacity="1"><g filter="url(#dustBlur)"><g transform="scale(60.26 24.84)"><use href="#dustShape"/></g></g><g filter="url(#ionBlur)"><g transform="scale(65.8 4.83)"><use href="#ionShape"/></g></g><g transform="scale(1.38)"><circle r="44" fill="url(#coma)"/><circle r="5.5" fill="#ffffff"/></g></g></g></g>
</svg>
