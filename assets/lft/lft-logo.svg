<?xml version="1.0" encoding="UTF-8"?>
<svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="75%">
      <stop offset="0" stop-color="#4b1f1a"></stop>
      <stop offset=".55" stop-color="#1c1211"></stop>
      <stop offset="1" stop-color="#0d0a0a"></stop>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1d0" stop-opacity=".05"></stop>
      <stop offset=".75" stop-color="#fff1d0" stop-opacity=".32"></stop>
      <stop offset="1" stop-color="#fff1d0" stop-opacity="0"></stop>
    </linearGradient>
    <clipPath id="slotClip"><rect id="slotRect" x="394" y="-200" width="102" height="1400"></rect></clipPath>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"></rect>

  <g id="stage" transform="translate(500 500) scale(1.2) translate(-500 -500)">
    <polygon id="beamPoly" fill="url(#beam)" opacity="0" points="408,-160 444,-160 527,690 325,690"></polygon>

    <g id="L" fill="#f5ecdd" transform="translate(179 350)">
      <rect x="0" y="0" width="62" height="300"></rect>
      <rect x="0" y="238" width="180" height="62"></rect>
    </g>
    <g id="F" fill="#f5ecdd" transform="translate(395 350)">
      <rect x="0" y="0" width="62" height="300"></rect>
      <rect x="0" y="0" width="180" height="62"></rect>
      <rect x="0" y="119" width="150" height="62"></rect>
    </g>
    <g id="T" fill="#f5ecdd" transform="translate(611 350)">
      <rect x="0" y="0" width="210" height="62"></rect>
      <rect x="74" y="0" width="62" height="300"></rect>
    </g>

    <!-- средние буквы -->
    <g id="midI" fill="#e5412f" opacity="0" transform="translate(395 -470)">
      <rect x="0" y="0" width="62" height="300"></rect>
    </g>
    <g clip-path="url(#slotClip)">
      <g id="midE" fill="#e9b44c" opacity="0">
        <rect id="eSpine" x="0" y="0" width="62" height="300"></rect>
        <rect id="eBar0" x="0" y="0" width="170" height="62"></rect>
        <rect id="eBar1" x="0" y="119" width="145" height="62"></rect>
        <rect id="eBar2" x="0" y="238" width="170" height="62"></rect>
      </g>
    </g>
    <g id="midO" opacity="0">
      <ellipse id="oRing" cx="0" cy="0" rx="79" ry="119" fill="none" stroke="#ff6f91" stroke-width="62"></ellipse>
    </g>
    <g id="midU" fill="#6cc4ec" opacity="0">
      <path d="M0,0 H62 V205 Q62,238 95,238 Q128,238 128,205 V0 H190 V205 Q190,300 95,300 Q0,300 0,205 Z"></path>
    </g>

    <!-- «вставить сюда» -->
    <polygon id="caret" fill="#e5412f" points="-30,0 30,0 0,42" transform="translate(377 258)" opacity="1"></polygon>
  </g>
</svg>
