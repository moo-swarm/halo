<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LFT Foro Teatro</title>
<!--
  LFT Foro Teatro — логотип и анимация.
  Между L и FT по очереди появляется буква, и получается слово.
  У каждой буквы свой цвет и свой способ появиться:
    LIFT — «поднять» (занавес): I падает в луче прожектора и улетает вверх;
    LEFT — «stage left», левая кулиса: E собирается и уходит влево;
    LOFT — колосниковая (fly loft): O сжимается, как диафрагма прожектора;
    LUFT — нем. «воздух»: U плавно опускается, покачиваясь, и её сдувает.
  Полный цикл — 9,8 с (лимит видео-аватарки Telegram — 10 с).
  ?t=<сек> — показать один кадр;  ?static — логотип без анимации.
-->
<style>
  html, body { margin: 0; height: 100%; background: #0d0a0a; }
  body { display: grid; place-items: center; overflow: hidden; }
  svg { width: min(100vw, 100vh); height: min(100vw, 100vh); display: block; }
</style>
</head>
<body>
<svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="75%">
      <stop offset="0" stop-color="#4b1f1a"/>
      <stop offset=".55" stop-color="#1c1211"/>
      <stop offset="1" stop-color="#0d0a0a"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1d0" stop-opacity=".05"/>
      <stop offset=".75" stop-color="#fff1d0" stop-opacity=".32"/>
      <stop offset="1" stop-color="#fff1d0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="slotClip"><rect id="slotRect" x="0" y="-200" width="0" height="1400"/></clipPath>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>

  <g id="stage">
    <polygon id="beamPoly" fill="url(#beam)" opacity="0"/>

    <g id="L" fill="#f5ecdd">
      <rect x="0" y="0" width="62" height="300"/>
      <rect x="0" y="238" width="180" height="62"/>
    </g>
    <g id="F" fill="#f5ecdd">
      <rect x="0" y="0" width="62" height="300"/>
      <rect x="0" y="0" width="180" height="62"/>
      <rect x="0" y="119" width="150" height="62"/>
    </g>
    <g id="T" fill="#f5ecdd">
      <rect x="0" y="0" width="210" height="62"/>
      <rect x="74" y="0" width="62" height="300"/>
    </g>

    <!-- средние буквы -->
    <g id="midI" fill="#e5412f" opacity="0">
      <rect x="0" y="0" width="62" height="300"/>
    </g>
    <g clip-path="url(#slotClip)">
      <g id="midE" fill="#e9b44c" opacity="0">
        <rect id="eSpine" x="0" y="0" width="62" height="300"/>
        <rect id="eBar0" x="0" y="0" width="170" height="62"/>
        <rect id="eBar1" x="0" y="119" width="145" height="62"/>
        <rect id="eBar2" x="0" y="238" width="170" height="62"/>
      </g>
    </g>
    <g id="midO" opacity="0">
      <ellipse id="oRing" cx="0" cy="0" rx="79" ry="119" fill="none" stroke="#ff6f91" stroke-width="62"/>
    </g>
    <g id="midU" fill="#6cc4ec" opacity="0">
      <path d="M0,0 H62 V205 Q62,238 95,238 Q128,238 128,205 V0 H190 V205 Q190,300 95,300 Q0,300 0,205 Z"/>
    </g>

    <!-- «вставить сюда» -->
    <polygon id="caret" fill="#e5412f" points="-30,0 30,0 0,42"/>
  </g>
</svg>

<script>
(() => {
  // ---------- геометрия ----------
  const Y0 = 350, H = 300, GAP = 36;
  const W = { L: 180, F: 180, T: 210 };
  const MID = { I: 62, E: 170, O: 220, U: 190 };
  const CLOSED = W.L + GAP + W.F + GAP + W.T;     // ширина «LFT»
  const CX = 500, CY = 500;                        // центр сцены

  // ---------- тайминг ----------
  const SEG = 2.45;                                 // одно слово
  const WORDS = ['I', 'E', 'O', 'U'];               // LIFT, LEFT, LOFT, LUFT
  const TOTAL = SEG * WORDS.length;                 // 9.8 с

  // ---------- easing ----------
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const span = (u, a, b) => clamp((u - a) / (b - a));
  const inOutCubic = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const outCubic = (t) => 1 - Math.pow(1 - t, 3);
  const inCubic = (t) => t * t * t;
  const outBack = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
  const inBack = (t, s = 1.7) => (s + 1) * t * t * t - s * t * t;
  const outBounce = (t) => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
    return n * (t -= 2.625 / d) * t + .984375;
  };

  const $ = (id) => document.getElementById(id);
  const set = (el, attrs) => { for (const k in attrs) el.setAttribute(k, attrs[k]); };
  const el = {
    stage: $('stage'), L: $('L'), F: $('F'), T: $('T'), caret: $('caret'), beam: $('beamPoly'),
    I: $('midI'), E: $('midE'), O: $('midO'), U: $('midU'), oRing: $('oRing'), slot: $('slotRect'),
    eSpine: $('eSpine'), eBars: [$('eBar0'), $('eBar1'), $('eBar2')],
  };

  function renderAt(t) {
    t = ((t % TOTAL) + TOTAL) % TOTAL;
    const idx = Math.min(WORDS.length - 1, Math.floor(t / SEG));
    const word = WORDS[idx];
    const u = t - idx * SEG;                      // локальное время слова
    const M = MID[word];

    // фазы
    const open = inOutCubic(span(u, .08, .42)) * (1 - inOutCubic(span(u, 2.02, 2.42)));
    const enterP = span(u, .38, 1.2);
    const exitP = span(u, 1.72, 2.08);

    // раскладка
    const total = CLOSED + open * (GAP + M);
    const x0 = CX - total / 2;
    const slotX = x0 + W.L + GAP;
    const fx = slotX + open * (M + GAP);
    const tx = fx + W.F + GAP;
    const s = Math.min(1.2, 860 / total);
    set(el.stage, { transform: `translate(${CX} ${CY}) scale(${s}) translate(${-CX} ${-CY})` });
    set(el.L, { transform: `translate(${x0} ${Y0})` });
    set(el.F, { transform: `translate(${fx} ${Y0})` });
    set(el.T, { transform: `translate(${tx} ${Y0})` });
    set(el.slot, { x: slotX - 1, width: M + 40 });

    // каретка «сюда»
    const gapCx = (x0 + W.L + fx) / 2;
    const caretVis = (1 - span(u, .35, .6)) + span(u, 2.15, 2.4);
    const bob = Math.sin(u / SEG * Math.PI * 2) * 6 * (1 - open);
    set(el.caret, { transform: `translate(${gapCx} ${Y0 - 92 + bob})`, opacity: clamp(caretVis) });

    // прожектор
    const midCx = slotX + M / 2;
    let beam = 0;
    if (word === 'I') beam = span(u, .05, .4) * (1 - span(u, 1.7, 2.05));
    if (word === 'O') beam = .6 * span(u, 1.0, 1.3) * (1 - span(u, 1.7, 2.0));
    const bw = M / 2 + 70;
    set(el.beam, {
      points: `${midCx - 18},-160 ${midCx + 18},-160 ${midCx + bw},${Y0 + H + 40} ${midCx - bw},${Y0 + H + 40}`,
      opacity: beam,
    });

    for (const k of WORDS) el[k].setAttribute('opacity', 0);
    const shown = enterP > 0 ? 1 : 0;

    if (word === 'I') {
      // LIFT: падает с колосников с отскоком, потом «поднимается» вверх
      const drop = (1 - outBounce(enterP)) * -820;
      const lift = inBack(exitP, 2.2) * -900;
      set(el.I, { opacity: shown, transform: `translate(${slotX} ${Y0 + drop + lift})` });
    }

    if (word === 'E') {
      // LEFT: вертикаль растёт снизу, перекладины выезжают слева; уходит влево
      const grow = outCubic(span(u, .38, .66));
      set(el.eSpine, { y: H * (1 - grow), height: H * grow });
      el.eBars.forEach((b, i) => {
        const p = outBack(span(u, .55 + i * .1, .92 + i * .1), 2.2);
        b.setAttribute('transform', `translate(${(p - 1) * 220} 0)`);
      });
      const leave = inCubic(exitP) * -(M + 60);
      set(el.E, { opacity: shown, transform: `translate(${slotX + leave} ${Y0})` });
    }

    if (word === 'O') {
      // LOFT: диафрагма прожектора сжимается в O; уходит, крутясь монеткой
      const p = inOutCubic(enterP);
      set(el.oRing, { rx: lerp(760, 79, p), ry: lerp(760, 119, p), 'stroke-width': lerp(4, 62, p) });
      const shrink = 1 - inCubic(exitP);
      const spin = Math.cos(exitP * Math.PI * 3) * shrink;
      set(el.O, {
        opacity: enterP > 0 ? clamp(enterP * 4) : 0,
        transform: `translate(${midCx} ${Y0 + H / 2}) scale(${spin} ${shrink})`,
      });
    }

    if (word === 'U') {
      // LUFT («воздух»): опускается, покачиваясь, как пёрышко; потом её сдувает вправо-вверх
      const p = span(u, .3, 1.3);
      const fall = outCubic(p);
      const sway = Math.sin(p * Math.PI * 3) * (1 - fall);
      const dx = sway * 70, dy = (1 - fall) * -620, rot = sway * 18;
      const w = inCubic(exitP);
      const bx = w * 620, by = w * -380, brot = w * 70;
      set(el.U, {
        opacity: p > 0 ? clamp(p * 5) * (1 - span(u, 1.95, 2.08)) : 0,
        transform: `translate(${slotX + dx + bx} ${Y0 + dy + by}) rotate(${rot + brot} 95 150)`,
      });
    }
  }

  window.LFT = { renderAt, TOTAL };

  const q = new URLSearchParams(location.search);
  if (q.has('t')) renderAt(parseFloat(q.get('t')) || 0);
  else if (q.has('static')) renderAt(0);
  else {
    const start = performance.now();
    const loop = (now) => { renderAt((now - start) / 1000); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
