# Deploy Halo Dashboard to GitHub Pages
#
# Runs on every push to main or manual dispatch.
# Deploys via GitHub Actions Pages API (deploy-pages action).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Explicit allowlist — only site files may reach the public artifact
      # (no server/, no static/test.html, no repo source).
      - name: Assemble site artifact
        run: |
          mkdir -p _site/data
          cp index.html styles.css dashboard.js _site/
          cp data/swarm.json _site/data/
          cp .nojekyll _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
