<!DOCTYPE html>
<html>
<head><title>Halo Test</title></head>
<body>
  <h1>Halo verification page</h1>
  <p>This is a static test page.</p>
  <p id="status">Loading external content...</p>
  <script>
    fetch('/static/halo.js')
      .then(r => r.text())
      .then(t => { document.getElementById('status').textContent = 'Loaded halo.js, length=' + t.length; })
      .catch(e => { document.getElementById('status').textContent = 'Error: ' + e.message; });
  </script>
  <div id="content-area">Initialization complete.</div>
</body>
</html>
